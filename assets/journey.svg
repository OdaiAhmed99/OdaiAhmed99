<svg xmlns="http://www.w3.org/2000/svg" width="880" height="800" viewBox="0 0 880 800" role="img" aria-label="Career journey timeline, 2020 to now">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .cmd { font-size: 13px; fill: #8b949e; }
    .cmd .p { fill: #39d353; }
    .range { font-size: 13px; fill: #8b949e; }
    .date { font-size: 12px; fill: #22d3ee; letter-spacing: .3px; }
    .title { font-size: 16px; font-weight: 600; fill: #e6edf3; }
    .desc { font-size: 13px; fill: #9198a1; }
    .chip { fill: #0d1117; stroke-width: 1; }
    .chipt { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; }
    .rail { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.6s ease-out .1s forwards; }
    .e { opacity: 0; animation: in .55s ease-out forwards; }
    .e1 { animation-delay: .15s } .e2 { animation-delay: .35s } .e3 { animation-delay: .55s }
    .e4 { animation-delay: .75s } .e5 { animation-delay: .95s } .e6 { animation-delay: 1.15s } .e7 { animation-delay: 1.35s }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out 2s infinite; opacity: 0; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }
  </style>
  <defs>
    <linearGradient id="railg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#39d353"/>
    </linearGradient>
  </defs>

  <rect class="bg" x=".5" y=".5" width="879" height="799" rx="12"/>

  <text class="mono cmd" x="32" y="44"><tspan class="p">$</tspan> git log --reverse career</text>
  <text class="mono range" x="848" y="44" text-anchor="end">2020 → now</text>
  <line x1="32" y1="64" x2="848" y2="64" stroke="#21262d"/>

  <line class="rail" x1="40" y1="106" x2="40" y2="706" stroke="url(#railg)" stroke-width="2"/>

  <!-- 1 -->
  <g transform="translate(0,110)"><g class="e e1">
    <circle cx="40" cy="-4" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text class="mono date" x="72" y="0">2020 – 2024</text>
    <rect class="chip" x="769" y="-15" width="79" height="20" rx="10" stroke="#58a6ff"/>
    <text class="mono chipt" x="808.5" y="-1.5" text-anchor="middle" fill="#58a6ff">EDUCATION</text>
    <text class="sans title" x="72" y="24">B.Sc. Data Science &amp; Artificial Intelligence</text>
    <text class="sans desc" x="72" y="46">Graduated with Excellent. Capstone: Arabic sign-language recognition using computer vision,</text>
    <text class="sans desc" x="72" y="64">hand-keypoint extraction, and speech-to-sign translation.</text>
  </g></g>

  <!-- 2 -->
  <g transform="translate(0,210)"><g class="e e2">
    <circle cx="40" cy="-4" r="6" fill="#0d1117" stroke="#4fb3f6" stroke-width="2"/>
    <text class="mono date" x="72" y="0">Oct – Dec 2024</text>
    <rect class="chip" x="762" y="-15" width="86" height="20" rx="10" stroke="#4fb3f6"/>
    <text class="mono chipt" x="805" y="-1.5" text-anchor="middle" fill="#4fb3f6">INTERNSHIP</text>
    <text class="sans title" x="72" y="24">AI Prompt Engineer</text>
    <text class="sans desc" x="72" y="46">Designed, tested, and iterated on prompts for LLM-based systems, validating model outputs</text>
    <text class="sans desc" x="72" y="64">and improving response quality on real-world AI workflows.</text>
  </g></g>

  <!-- 3 -->
  <g transform="translate(0,310)"><g class="e e3">
    <circle cx="40" cy="-4" r="6" fill="#0d1117" stroke="#45c0ec" stroke-width="2"/>
    <text class="mono date" x="72" y="0">Jan 2025 – Jan 2026</text>
    <rect class="chip" x="769" y="-15" width="79" height="20" rx="10" stroke="#45c0ec"/>
    <text class="mono chipt" x="808.5" y="-1.5" text-anchor="middle" fill="#45c0ec">FULL-TIME</text>
    <text class="sans title" x="72" y="24">Backend Developer · E-learning</text>
    <text class="sans desc" x="72" y="46">Took a learning platform from MVP to production for 1,000+ users: courses, mentorship,</text>
    <text class="sans desc" x="72" y="64">payments, certificates, live sessions, gamification, and 35+ expert-led events.</text>
  </g></g>

  <!-- 4 -->
  <g transform="translate(0,410)"><g class="e e4">
    <circle class="pulse" cx="40" cy="-4" r="6" fill="#22d3ee"/>
    <circle cx="40" cy="-4" r="6" fill="#22d3ee" stroke="#22d3ee" stroke-width="2"/>
    <text class="mono date" x="72" y="0">Oct 2025 – now</text>
    <rect class="chip" x="762" y="-15" width="86" height="20" rx="10" stroke="#22d3ee"/>
    <text class="mono chipt" x="805" y="-1.5" text-anchor="middle" fill="#22d3ee">CO-FOUNDER</text>
    <text class="sans title" x="72" y="24">Servo · Agentic AI agent for businesses</text>
    <text class="sans desc" x="72" y="46">Building an agentic AI that helps companies run their day-to-day operations. Shipped the MVP</text>
    <text class="sans desc" x="72" y="64">end to end, then led a full product and technical pivot driven by user feedback.</text>
  </g></g>

  <!-- 5 -->
  <g transform="translate(0,510)"><g class="e e5">
    <circle cx="40" cy="-4" r="6" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
    <text class="mono date" x="72" y="0">Late 2025 – 2026</text>
    <rect class="chip" x="769" y="-15" width="79" height="20" rx="10" stroke="#2dd4bf"/>
    <text class="mono chipt" x="808.5" y="-1.5" text-anchor="middle" fill="#2dd4bf">FREELANCE</text>
    <text class="sans title" x="72" y="24">Commerce, healthcare &amp; safety platforms</text>
    <text class="sans desc" x="72" y="46">A multi-tenant e-commerce platform still live in production, AI-driven construction-safety APIs,</text>
    <text class="sans desc" x="72" y="64">real-time patient-request alerts, and a Telegram-connected AI platform for a Gulf client.</text>
  </g></g>

  <!-- 6 -->
  <g transform="translate(0,610)"><g class="e e6">
    <circle cx="40" cy="-4" r="6" fill="#0d1117" stroke="#34d399" stroke-width="2"/>
    <text class="mono date" x="72" y="0">Mar – Aug 2026</text>
    <rect class="chip" x="735" y="-15" width="113" height="20" rx="10" stroke="#34d399"/>
    <text class="mono chipt" x="791.5" y="-1.5" text-anchor="middle" fill="#34d399">INDUSTRIAL IOT</text>
    <text class="sans title" x="72" y="24">Cyber-physical factory platform</text>
    <text class="sans desc" x="72" y="46">Backend for a system unifying factory operations (assets, inventory, IoT devices, automation),</text>
    <text class="sans desc" x="72" y="64">plus an ERP integration that triggers production-line steps the moment an order is created.</text>
  </g></g>

  <!-- 7 -->
  <g transform="translate(0,710)"><g class="e e7">
    <circle class="pulse" cx="40" cy="-4" r="6" fill="#39d353"/>
    <circle cx="40" cy="-4" r="6" fill="#39d353" stroke="#39d353" stroke-width="2"/>
    <text class="mono date" x="72" y="0">Aug 2026 – now</text>
    <rect class="chip" x="782" y="-15" width="66" height="20" rx="10" stroke="#39d353"/>
    <text class="mono chipt" x="815" y="-1.5" text-anchor="middle" fill="#39d353">CURRENT</text>
    <text class="sans title" x="72" y="24">Integrations Developer · Open-source automation</text>
    <text class="sans desc" x="72" y="46">Building, maintaining, and fixing integrations for an AI workflow platform with 700+ integrations</text>
    <text class="sans desc" x="72" y="64">and 300,000+ builders: OAuth2, webhooks, polling triggers, and typed input/output schemas.</text>
  </g></g>
</svg>
